# Guarantee inventory for the gryph acceptance suite. One entry per guarantee.
# Coverage is derived: a script whose path id matches means covered. Never
# author a coverage field.
#
# The category is the first path segment of the script id.
# The tier is P0 (incident) | P1 (important) | P2 (tracked).
# Labels are free-form tags. A run can filter by category and by labels.

- id: install/claude-code/hooks-written
  title: "gryph install writes Claude Code hooks and keeps foreign entries"
  category: install
  tier: P0
  guarantee: "gryph install --agent claude-code adds gryph hook entries to ~/.claude/settings.json and keeps pre-existing hooks and settings."
  labels: [install, claude-code]

- id: install/command/absolute-path
  title: "gryph install names the binary by its absolute path"
  category: install
  tier: P0
  guarantee: "Every hook entry that gryph install writes names the gryph binary by its absolute path, so the hook does not depend on PATH, and doctor reads the install as valid."
  labels: [install, command, claude-code]

- id: install/command/legacy-accepted
  title: "hook entries with the bare program name stay valid"
  category: install
  tier: P1
  guarantee: "Hook entries from an earlier install that name the bare program gryph read as installed and valid in doctor and status, and gryph install --force rewrites them with the absolute path."
  labels: [install, command, claude-code]

- id: install/uninstall/round-trip
  title: "gryph uninstall removes only gryph hooks and restores backups"
  category: install
  tier: P0
  guarantee: "gryph uninstall removes gryph hook entries, keeps foreign hooks, writes a backup on install, and --restore-backup brings the original file back."
  labels: [install, uninstall, backup, claude-code]

- id: hook/ingest/event-persisted
  title: "a hook payload becomes a queryable event in one session"
  category: hook
  tier: P0
  guarantee: "gryph _hook parses a real agent payload from stdin, exits zero, persists the event, and maps repeated payloads of one agent session to one gryph session."
  labels: [hook, ingest, claude-code]

- id: policy/managed/sources-load
  title: "managed policy files load as sources with the chain check"
  category: policy
  tier: P0
  guarantee: "policy.yaml and policies/ in the system managed directory load as policy sources, gryph policy list shows them with the managed scope, the user's own policy still loads, and a managed file that fails the chain check fails the policy load. Privileged job only."
  labels: [policy, managed, privileged, linux]

- id: policy/managed/user-policy-dropped
  title: "allow_user_policy false in the managed configuration drops the user sources"
  category: policy
  tier: P1
  guarantee: "With allow_user_policy: false in the managed configuration, the user's policy sources do not load, gryph policy list says so, and policy.self_protection.enabled in the file cannot turn the built-in rules off. Privileged job only."
  labels: [policy, managed, privileged, linux]

- id: policy/block/dangerous-command
  title: "a policy block rule stops the action with the agent's protocol"
  category: policy
  tier: P0
  guarantee: "A matching block rule makes the Claude Code hook exit 2 with the reason, makes the Cursor hook exit 0 with a deny JSON on stdout, and persists the event as blocked."
  labels: [policy, block, claude-code, cursor]

- id: policy/receipts/follow-streams-decisions
  title: "policy receipts --follow streams new receipts with the matched rule"
  category: policy
  tier: P1
  guarantee: "gryph policy receipts --follow prints the latest receipts, then each new receipt once, with its decision, matched rule and command. SIGINT stops it with exit 0."
  labels: [policy, receipts, follow]

- id: policy/shell/budget-exceeded-fails-closed
  title: "a command past the shell analysis budget fails closed"
  category: policy
  tier: P0
  guarantee: "When the shell analysis of a command runs past policy.shell_budget, the hook still answers and the builtin rules block the command. The same command runs under the default budget. gryph config set rejects a bad budget, and a bad budget in the file falls back to the default with the policy still on."
  labels: [policy, shell, self-protection, claude-code]

- id: security/keys/windows-acl-refused
  title: "Windows refuses a key file that another principal can read"
  category: security
  tier: P1
  guarantee: "On Windows, Gryph creates the export key with an owner-only DACL and loads it. A key with a DACL entry for Everyone fails to load, and the error names an icacls command that fixes it. After the entry goes, the key loads."
  labels: [security, keys, windows]

- id: policy/self-protection/config-write-blocked
  title: "builtin self-protection blocks writes to gryph and hook config"
  category: policy
  tier: P0
  guarantee: "With policy enabled, an agent write to the gryph config directory, the export key, or an agent hook config file is blocked by the builtin rules. A shell command that removes the config directory in bash -euo pipefail -c is blocked too."
  labels: [policy, self-protection]

- id: policy/self-protection/command-code-hookcfg-blocked
  title: "builtin self-protection blocks Command Code hook config changes"
  category: policy
  tier: P0
  guarantee: "With policy enabled, a Command Code write or edit of ~/.commandcode/settings.json, and a shell command that removes, redirects into, or edits it in place, is blocked by the builtin rules."
  labels: [policy, self-protection, command-code]

- id: policy/self-protection/database-read-blocked
  title: "builtin self-protection blocks reads of the gryph database and keys"
  category: policy
  tier: P0
  guarantee: "With policy enabled, an agent read of the database, its WAL or SHM file, the receipt signing key, or the export key is blocked. A Grep of the data directory, of the config directory, or of the config parent directory is blocked. sqlite3, cat, cp, base64, and cd-then-read commands that read them are blocked. A read of a project file or an agent hook config, and a Grep of the home directory, pass."
  labels: [policy, self-protection]

- id: policy/self-protection/hook-command-blocked
  title: "builtin self-protection blocks agent shell commands that run gryph _hook"
  category: policy
  tier: P0
  guarantee: "With policy enabled, an agent shell command that runs gryph _hook with a literal _hook argument, directly, in a nested shell (also after a flag group such as -euo pipefail), or through ANSI-C quoting, is blocked at exit 2, so it cannot forge a user prompt. Another gryph command passes, also with a variable argument. A grep for a word that holds _hook passes."
  labels: [policy, self-protection, intent]

- id: policy/self-protection/resolve-blocked
  title: "builtin self-protection blocks agent shell commands that resolve an approval"
  category: policy
  tier: P1
  guarantee: "With policy enabled, an agent shell command that runs gryph policy approve resolve or gryph policy deferrals resolve with literal words, directly, with flags between the words, or in a nested shell, is blocked at exit 2, so it cannot answer the approval the agent waits on. The approve list and show commands pass, and so does a resolve word that a variable supplies."
  labels: [policy, self-protection, approval]

- id: policy/file-access/read-rule-matches-shell-reads
  title: "file_access selects which shell targets a file rule matches"
  category: policy
  tier: P1
  guarantee: "A rule with file_access [read] blocks a shell read of a matching path and passes a shell write. A rule without file_access blocks a shell write and passes a shell read."
  labels: [policy]

- id: privacy/redaction/digest-before-redact
  title: "redaction keeps the digest of the original value"
  category: privacy
  tier: P1
  guarantee: "A command with a matched token stores [REDACTED], sets redacted to true in its label, and keeps the digest of the original value in the local store. Export drops that digest."
  labels: [privacy, labels]

- id: privacy/sensitive/content-never-stored
  title: "sensitive file content never reaches storage or export"
  category: privacy
  tier: P0
  guarantee: "A write to a sensitive path is flagged, and its content is not stored at any logging level. The default export profile exports the event and drops the secret label. The full profile keeps the secret class and the stripped flag, and drops the digest."
  labels: [privacy, sensitive, redaction, export]

- id: privacy/export/profile-treatments
  title: "export applies the export profile to each content value"
  category: privacy
  tier: P0
  guarantee: "gryph export digests a user prompt under the default profile, keeps labels and digests only under metadata, and includes every value under full. Only full exports the raw event, which holds the file content of a read. An exported digest is an HMAC with a key of the install, never a plain sha256. Export never drops a whole event, and fails on an unknown profile name."
  labels: [privacy, export]

- id: privacy/export/user-profile
  title: "a user export profile gives a treatment by origin or class"
  category: privacy
  tier: P1
  guarantee: "A profile under export.profiles redacts a user prompt by its origin and digests other values by its default. A value that no rule matches gets the default treatment of the profile."
  labels: [privacy, export, config]

- id: privacy/export/policy-profile
  title: "the policy export profile sends the fields rules match on and no content"
  category: privacy
  tier: P0
  guarantee: "Under the built-in policy profile, an export digests prompts and content, drops every secret, pii and unknown_sensitive value, keeps the command with the query and the userinfo of its URLs removed and the redactor run once more, and never carries the raw event."
  labels: [privacy, export, cloud]

- id: privacy/export/field-match
  title: "an export rule can match a value by its field"
  category: privacy
  tier: P0
  guarantee: "An export rule with fields applies its treatment to the named content fields whatever their labels. A rule that names a field no event has is a config error, and the export fails for that profile instead of falling back."
  labels: [privacy, export]

- id: cloud/collection/level-notice
  title: "the collection level of a managed host is set once and told once"
  category: cloud
  tier: P1
  guarantee: "The managed configuration sets collection.level to evidence, policy or full. The decision service tells the developer once on the first hook after the managed file sets a level and after each change, records the change on the self-audit log, and gryph doctor and gryph doctor --managed show the level, the profile and the target. A level the file does not know is a configuration error. Privileged job only."
  labels: [cloud, collection, supervisor, privileged, linux]

- id: privacy/export/invalid-profile
  title: "an invalid export profile fails closed for that profile only"
  category: privacy
  tier: P1
  guarantee: "An invalid profile under export.profiles does not reset the config, so the hook keeps its settings. gryph export and stream sync fail for that profile, and never fall back to a weaker profile."
  labels: [privacy, export, config, streams]

- id: privacy/stream/target-profile
  title: "stream sync applies the export profile of each target"
  category: privacy
  tier: P0
  guarantee: "gryph stream sync applies streams.targets[].export_profile to every event before it sends it. A target without export_profile gets the default profile."
  labels: [privacy, export, streams]

- id: receipts/verify-log/redacted-export-verifies
  title: "a receipt export under any profile verifies"
  category: receipts
  tier: P0
  guarantee: "Gryph writes receipts with hash v2 and salted commitments of the command and the URL. An export with --export-profile metadata has no command, no token and no salt, and it verifies. A changed commitment, or a changed command next to its salt, fails verification."
  labels: [receipts, privacy, export]

- id: receipts/verify-log/v1-still-verifies
  title: "a receipt export from before hash v2 verifies"
  category: receipts
  tier: P1
  guarantee: "gryph policy receipts verify-log verifies a v1 export without hash_version. A v1 row whose command an export profile removed fails with a reason that names --export-profile full."
  labels: [receipts, compatibility]

- id: receipts/verify-log/tamper-fails
  title: "receipt log verification detects tampering"
  category: receipts
  tier: P1
  guarantee: "gryph policy receipts verify-log exits zero on an untampered export and exits non-zero after one field changes."
  labels: [policy, receipts, aarm]

- id: export/schema/jsonl-stable
  title: "export emits schema-tagged JSONL with a clean stdout"
  category: export
  tier: P1
  guarantee: "gryph export writes one JSON object per line with a $schema field and prints the summary to stderr only."
  labels: [export, jsonl, automation]

- id: errors/exit-codes/contract
  title: "documented exit codes hold on the real binary"
  category: errors
  tier: P1
  guarantee: "An unknown agent exits 4 and an invalid configuration exits 2, with the error on stderr."
  labels: [errors, exit-codes]

- id: health/status-doctor/healthy
  title: "status and doctor report a healthy installation"
  category: health
  tier: P1
  guarantee: "After install, gryph status shows the agent as installed and gryph doctor exits zero with passing checks."
  labels: [status, doctor]

- id: policy/fail-mode/closed-on-broken-policy
  title: "a broken policy fails closed, never silently off"
  category: policy
  tier: P0
  guarantee: "With fail_mode closed, a policy that does not load blocks the action and records a policy_load_error self-audit. With fail_mode open the action passes."
  labels: [policy, fail-mode, self-audit]

- id: policy/authoring/install-multi-file
  title: "policy validate, install, and list work end to end"
  category: policy
  tier: P0
  guarantee: "gryph policy validate --file checks a draft, policy install copies it into policies/, policy list shows the merged sources, and the installed rule enforces."
  labels: [policy, authoring]

- id: install/all-agents/files-written
  title: "one install covers every detected agent's documented file"
  category: install
  tier: P0
  guarantee: "gryph install writes each detected agent's hook file as documented, and gryph uninstall removes every gryph entry and generated file."
  labels: [install, all-agents]

- id: hook/protocols/block-matrix
  title: "every agent protocol refuses a blocked action"
  category: hook
  tier: P0
  guarantee: "A block decision reaches gemini, opencode, windsurf, pi-agent, and codex through each protocol's exit code and response channel, and every event persists as blocked."
  labels: [policy, block, protocols]

- id: policy/defer/timeout-resolves-deny
  title: "a deferred action resolves by decision or times out to deny"
  category: policy
  tier: P0
  guarantee: "A defer decision blocks the action and queues it. A human resolves it with a decision. The sweep resolves an expired deferral to timeout, which denies."
  labels: [policy, defer]

- id: policy/guidance/advisory-delivered
  title: "a guidance rule advises without blocking"
  category: policy
  tier: P1
  guarantee: "A guidance decision exits zero, delivers the advisory on the agent's channel, and persists the event as success."
  labels: [policy, guidance, claude-code, cursor]

- id: receipts/signing/key-round-trip
  title: "signed receipts verify and a tampered signature fails"
  category: receipts
  tier: P1
  guarantee: "After keys generate, receipts are signed, verify-log validates them against the trust store, and a tampered signature fails verification with a non-zero exit."
  labels: [policy, receipts, signing]

- id: cost/tokens/from-transcript
  title: "session end collects token usage from the transcript"
  category: cost
  tier: P1
  guarantee: "A session end hook with a transcript path makes gryph cost report the session's tokens and model."
  labels: [cost, tokens]

- id: cost/session-end/totals
  title: "the hook process sends the session cost totals as a client report"
  category: cost
  tier: P1
  guarantee: "On session end the hook process reads the transcript as the user and the session stores the totals with cost source client_reported:transcript. A missing transcript leaves no cost data."
  labels: [cost, tokens, session]

- id: install/managed/claude-code-entry
  title: "install --managed writes the Claude Code managed hook entry"
  category: install
  tier: P0
  guarantee: "As root, gryph install --managed --config writes the managed configuration to the system directory and the Claude Code drop-in under managed-settings.d with the Gryph hooks, before any user has the agent, and the lock switch adds allowManagedHooksOnly. Under that configuration gryph doctor puts the Claude Code hook_config row at prevent_same_user. Privileged job only."
  labels: [install, managed, privileged, linux]

- id: install/managed/codex-entry
  title: "install --managed writes the Codex managed hook entries"
  category: install
  tier: P0
  guarantee: "gryph install --managed writes the Gryph entries into /etc/codex/requirements.toml, pins the hooks feature on, keeps the administrator keys, and sets allow_managed_hooks_only only with the lock. Privileged job only."
  labels: [install, managed, privileged, linux]

- id: install/managed/idempotent
  title: "install --managed is idempotent and follows the allowlist"
  category: install
  tier: P0
  guarantee: "A second run with the same input changes nothing and exits 0. An agent removed from the allowlist loses its managed entries on the next run. Privileged job only."
  labels: [install, managed, privileged, linux]

- id: install/managed/invalid-config-exit-3
  title: "install --managed exits 3 on invalid input and changes nothing"
  category: install
  tier: P0
  guarantee: "A file that does not parse, an unknown agent, a lock outside the allowlist, a missing --config, or an input file another user can write exits 3 with nothing written. Privileged job only."
  labels: [install, managed, privileged, linux]

- id: install/managed/binary-chain-refused
  title: "install --managed refuses a binary that another user can replace"
  category: install
  tier: P0
  guarantee: "A managed binary in a directory writable by group or other, or a missing binary, fails the chain check: exit 3, nothing written. Privileged job only."
  labels: [install, managed, privileged, linux]

- id: install/managed/env-no-effect
  title: "install --managed reads no environment variable"
  category: install
  tier: P0
  guarantee: "Under --managed, HOME, XDG_* and GRYPH_* have no effect: the configuration lands in the system directory and nothing lands in the user home. Privileged job only."
  labels: [install, managed, privileged, linux]

- id: install/managed/cursor-system-path
  title: "install --managed writes the Cursor enterprise hooks with failClosed"
  category: install
  tier: P1
  guarantee: "gryph install --managed writes the Gryph entries into the Cursor enterprise hooks.json with failClosed on every entry, keeps the administrator entries, reports the class system_path, and exits 3 on a lock for Cursor, which has none. Privileged job only."
  labels: [install, managed, privileged, linux]

- id: install/managed/gemini-system-path
  title: "install --managed writes the Gemini CLI system settings and doctor names the entry"
  category: install
  tier: P1
  guarantee: "gryph install --managed writes the Gryph entries into the Gemini CLI system settings.json, pins hooksConfig.enabled, keeps the other settings, and gryph doctor names the managed entry on the hook_config row while the user scope stays at detect. Privileged job only."
  labels: [install, managed, privileged, linux]

- id: install/managed/windsurf-system-path
  title: "install --managed writes the Windsurf system hooks"
  category: install
  tier: P1
  guarantee: "gryph install --managed writes the Gryph entries into the Cascade system hooks.json and reports the class system_path. Privileged job only."
  labels: [install, managed, privileged, linux]

- id: uninstall/managed/round-trip
  title: "uninstall --managed reverses install --managed"
  category: uninstall
  tier: P0
  guarantee: "gryph uninstall --managed removes the Gryph entries from every managed hook file, keeps the administrator entries, removes the managed policy and configuration, and a second run changes nothing. Privileged job only."
  labels: [uninstall, managed, privileged, linux]

- id: uninstall/managed/uid-drop
  title: "uninstall --managed cleans each home as that account"
  category: uninstall
  tier: P0
  guarantee: "gryph uninstall --managed removes the Gryph entries from the agent hook files in every account's home through a helper that runs as that account. The helper keeps the account's other hooks and the file owner, and a link to a root-owned file changes nothing. Privileged job only."
  labels: [uninstall, managed, privileged, linux]

- id: install/managed/windows-acl-gate
  title: "Windows ignores a planted managed config and refuses it for install --managed"
  category: install
  tier: P0
  guarantee: "On Windows, Gryph reads the managed directory from the shell and not from PROGRAMDATA. A config.yml planted under a user-controlled PROGRAMDATA is ignored, and gryph install --managed with that file exits 3 with nothing changed, because the file fails the owner and DACL chain check."
  labels: [install, managed, windows]

- id: ipc/protocol/unknown-frame
  title: "the decision service answers an unknown frame with error unsupported"
  category: ipc
  tier: P0
  guarantee: "Over the wire format, hello gets welcome, a frame type the binary does not know gets error with code unsupported, a frame that fails its bounds gets error with code invalid, and the connection goes on to answer the next frame. Unknown fields are ignored."
  labels: [ipc, protocol, supervisor]

- id: supervisor/run/handle-decision
  title: "supervisor run serves a decision on the socket and opens the partition of the peer"
  category: supervisor
  tier: P0
  guarantee: "gryph supervisor run listens on a Unix socket. A client gets welcome with the profile, a decision for a hook payload, ack for a hook error report, the rows of its own partition for a read, and error invalid for a prompt reply when no prompt is open. The partition of the peer account appears under the state directory."
  labels: [supervisor, ipc]

- id: supervisor/peer/uid-partition
  title: "the service keys every partition on the peer uid"
  category: supervisor
  tier: P0
  guarantee: "Two accounts that send the same frames get two partitions under the state directory, each with its own session and nothing of the other. The tenant key is the uid the kernel reports, never a field of a request. Privileged job only."
  labels: [supervisor, privileged, linux]

- id: supervisor/limits/per-uid
  title: "the service bounds the connections and the requests of one account"
  category: supervisor
  tier: P0
  guarantee: "The newest connection of an account above the connection limit gets error rate_limited and closes. A flood of requests over the rate gets error rate_limited, the service records one tamper event in the system session of the account, and another account is not affected. Privileged job only."
  labels: [supervisor, privileged, linux]

- id: hook/client/fallback-block
  title: "in client mode a blocking hook blocks when the service is absent"
  category: hook
  tier: P0
  guarantee: "Under a managed configuration with supervisor.enabled, the hook is a client of the decision service and opens no store. With no service at the socket, a blocking hook blocks with one stderr line, supervisor.unavailable.blocking: allow lets it through, and supervisor.enabled: false keeps the in-process decision. Privileged job only."
  labels: [hook, client, supervisor, privileged, linux]

- id: hook/client/prompt-allow-spooled
  title: "in client mode a prompt or lifecycle hook allows and spools when the service is absent"
  category: hook
  tier: P0
  guarantee: "With no service at the socket, a prompt hook and a lifecycle hook allow, and the client leaves each payload in the spool of its own account, mode 0770 with files at 0640 so the service account reads them, with the verdict and the reason. Privileged job only."
  labels: [hook, client, supervisor, privileged, linux]

- id: hook/client/socket-held-no-welcome
  title: "a socket without welcome counts as an absent service"
  category: hook
  tier: P0
  guarantee: "A service that accepts the connect and never sends welcome makes the client give up within the handshake budget: a blocking hook blocks with the one stderr line and the spool holds the block. Privileged job only."
  labels: [hook, client, supervisor, privileged, linux]

- id: hook/client/old-client-new-server
  title: "an unknown verdict from a newer service blocks"
  category: hook
  tier: P0
  guarantee: "A service that answers a decision with a verdict this binary does not know makes every hook block, prompt hooks included, because the service answered and this is not the absent-service case. Privileged job only."
  labels: [hook, client, supervisor, privileged, linux]

- id: hook/client/new-client-old-server
  title: "a service that does not know the frames of this client blocks"
  category: hook
  tier: P0
  guarantee: "A service that answers error unsupported to a hook request, as an older service during an upgrade, makes a blocking hook block and a prompt hook pass, because the service answered and the phase rule decides. The spool keeps both decisions with the refusal. Privileged job only."
  labels: [hook, client, supervisor, privileged, linux]

- id: hook/client/killed-during-request
  title: "a service that stops in the middle of a request leaves the fail mode"
  category: hook
  tier: P0
  guarantee: "A stop of the decision service with SIGTERM drains the request a blocking hook waits on, so the hook gets its answer. A kill with SIGKILL cannot drain: the hook blocks with the absent-service line, exits 2, and leaves the decision in the spool with the cause. Privileged job only."
  labels: [hook, client, supervisor, chaos, privileged, linux]

- id: hook/client/fake-socket-refused
  title: "the hook client refuses a socket that is not the system's"
  category: hook
  tier: P0
  guarantee: "The hook client accepts the service socket only when root owns it and every directory above it is root-owned and not writable by others, and when the peer runs as root or the service account. A socket in a user's directory, or one whose peer is another user, blocks every hook in every mode with one stderr line, leaves a tamper entry in the spool, and never falls back. A root service passes. Privileged job only."
  labels: [hook, client, supervisor, privileged, linux]

- id: spool/ingest/owner-partition
  title: "the service assigns a spool entry to the owner of its directory"
  category: spool
  tier: P0
  guarantee: "A spool entry goes to the partition of the account that owns the directory it sits in, never to the account the directory is named for, as a receipt with the decision unverified. A file inside that another account owns is refused unread, removed, and reported as a spool_refused tamper event in the system session of the directory owner. The service makes the spool root with the set-group-ID and sticky bits. Privileged job only."
  labels: [spool, supervisor, privileged, linux]

- id: spool/ingest/fifo-symlink-refused
  title: "the service reads a spool file from a descriptor that never follows a link or waits"
  category: spool
  tier: P0
  guarantee: "A FIFO, a symbolic link and a file with two links in an account's spool are refused unread and removed, the target of the link is untouched, the service keeps answering through the pass, and one spool_refused tamper event names each file and its reason. Privileged job only."
  labels: [spool, supervisor, privileged, linux]

- id: spool/quota/bound
  title: "one pass takes at most the quota of entries from one account"
  category: spool
  tier: P1
  guarantee: "With --spool-max-files 3 and five entries, three become unverified receipts, two are removed unread, and one spool_refused tamper event records the count dropped. Privileged job only."
  labels: [spool, supervisor, privileged, linux]

- id: spool/flood/degraded-while-up
  title: "entries decided alone while the service ran become a degraded tamper event"
  category: spool
  tier: P1
  guarantee: "A spool entry whose recorded_at is after the start of the service means the client could not reach a running service. One pass records one degraded tamper event with the count of such entries, and an entry from before the start records nothing. Privileged job only."
  labels: [spool, supervisor, privileged, linux]

- id: hook/client/pilot-local-ephemeral
  title: "a blocking hook in the pilot profile evaluates the managed policy itself when the service is out of reach"
  category: hook
  tier: P0
  guarantee: "Under supervisor.profile pilot with no service at the socket, a blocking hook evaluates the managed policy and the built-in rules in process with no store, no context and no signature: an allowed command goes through, a blocked one blocks with the rule's message, a rule that reads the session context blocks, and every decision lands in the spool marked degraded. gryph doctor names the profile and the time the pilot has left. A pilot past pilot_until runs enforce. Privileged job only."
  labels: [hook, client, supervisor, pilot, privileged, linux]

- id: policy/degraded/context-rule-blocks
  title: "the degraded evaluation blocks a rule that reads the session context"
  category: policy
  tier: P0
  guarantee: "With --degraded, gryph policy test evaluates as the hook does in the pilot profile with the service out of reach: a rule whose condition reads context.* blocks with a message that names the missing context, a condition on the action alone evaluates as always, and an unmatched action allows."
  labels: [policy, degraded, pilot]

- id: policy/test/nop-not-degraded
  title: "the Nop accumulator alone never turns the degraded gate on"
  category: policy
  tier: P0
  guarantee: "gryph policy test without --degraded evaluates a rule that reads context.* against the given counters, zeros by default, so the counter rule does not fire without --context-files-written and fires with it. The degraded gate is the explicit flag, not the accumulator."
  labels: [policy, degraded, test]

- id: supervisor/keys/custody
  title: "the machine key belongs to the service account and signs in the supervisor scope"
  category: supervisor
  tier: P0
  guarantee: "gryph install --managed with the service on makes the receipt key, its public half and the export key under the state directory, hands them to the service account at mode 0600, puts the public half in the managed trust store, and changes nothing on a second run. The service, run as the service account, signs every receipt with that key in the supervisor scope, and the receipts verify against the managed store. doctor --managed reports the key as supervisor-owned and protected. Privileged job only."
  labels: [supervisor, keys, privileged, linux]

- id: receipts/managed/rotate-verifies
  title: "a key rotation keeps the old receipts verifiable and re-points the running service"
  category: receipts
  tier: P0
  guarantee: "gryph supervisor keys rotate writes a new key, appends its public half to the managed trust store next to the keys already there, and reloads the running service through its pid file. Receipts signed before and after the rotation both verify, each with its own key id. Privileged job only."
  labels: [receipts, supervisor, keys, privileged, linux]

- id: reads/system-mode/own-partition-only
  title: "the read commands of a managed host read the own partition through the service"
  category: reads
  tier: P0
  guarantee: "Under a managed configuration with the decision service on, sessions, query, logs, cat and policy receipts answer from the partition of the account that the kernel reports for the socket connection, through the service. An account sees its own log and nothing of another account, opens no database of its own, cannot read another partition on disk, and gets a clear error without the service. Privileged job only."
  labels: [reads, supervisor, privileged, linux]

- id: import/user-db/rows-marked
  title: "gryph supervisor import carries the own database into the service, marked imported"
  category: import
  tier: P1
  guarantee: "As the account, gryph supervisor import sends the sessions, events and receipts of the account's own database to the decision service. The service stores them in the partition of the account marked imported, the receipts keep the account's own signatures and verify against the account's trust store, a second run changes nothing, and the database in the home stays as it was. Privileged job only."
  labels: [import, supervisor, privileged, linux]

- id: approval/inline/tty-approve
  title: "an escalate rule that accepts the terminal asks on the terminal of the hook"
  category: approval
  tier: P0
  guarantee: "On a managed host with the decision service on, an escalate rule with min_assurance same-user-tty puts the prompt on the terminal of the hook. y allows the action and n blocks it with the note. The request store and the receipt record the channel, the assurance, the approver and the connection trust of each answer. Privileged job only."
  labels: [approval, supervisor, privileged, linux]

- id: approval/inline/no-stored-grant
  title: "an answer on the terminal applies to its request only and stores no grant"
  category: approval
  tier: P0
  guarantee: "After an approval on the terminal, the same action asks again. Without an answer the hook blocks with the request pending, names the request and the command that shows it, and the receipt keeps escalate until an answer or the expiry closes the request. Privileged job only."
  labels: [approval, supervisor, privileged, linux]

- id: approval/inline/wait-bounded
  title: "the client bounds the inline wait by the configured wait and the hook timeout"
  category: approval
  tier: P0
  guarantee: "A hook waits for an inline answer no longer than policy.approval.inline_wait and never past the hook timeout of the agent minus the margin. A wait under two seconds is no wait: the hook blocks at once with the request pending and shows no prompt. Privileged job only."
  labels: [approval, supervisor, privileged, linux]

- id: approval/expiry/deny
  title: "an unanswered request expires as a deny and the next hook reports it"
  category: approval
  tier: P1
  guarantee: "A request that nobody answers within policy.approval.request_ttl expires. The receipt records approval_timeout with the resolver, and the next hook of the session tells the agent once. A rule above the assurance of the terminal never asks the terminal. Privileged job only."
  labels: [approval, supervisor, privileged, linux]

- id: approval/admin/group-member
  title: "a member of the approval group answers another account's request"
  category: approval
  tier: P0
  guarantee: "On a managed host, a member of policy.approval.local_admin.group lists the pending requests of every account and answers one with gryph policy approve resolve after a confirmation on the terminal. The service checks the group and the account against the peer credentials, records the assurance of the answer, tells the requester's next hook, and a session grant lets the retries through. Privileged job only."
  labels: [approval, supervisor, admin, privileged, linux]

- id: approval/admin/grant-used-once
  title: "a once grant lets the retry through one time"
  category: approval
  tier: P0
  guarantee: "An allow with the scope once lets the same action through one time, and the second retry asks again. A scope wider than policy.approval.max_grant_scope is refused before anything changes. Privileged job only."
  labels: [approval, supervisor, admin, privileged, linux]

- id: approval/admin/non-member-refused
  title: "an account outside the approval group cannot answer"
  category: approval
  tier: P0
  guarantee: "An account outside policy.approval.local_admin.group sees its own requests only and cannot answer another account's request. The request stays pending. Privileged job only."
  labels: [approval, supervisor, admin, privileged, linux]

- id: approval/admin/requester-uid-refused
  title: "the account that asked cannot answer its own request"
  category: approval
  tier: P0
  guarantee: "The service refuses an answer from the account that asked, also when that account is in the approval group, and gryph policy approve resolve refuses --yes on a managed host. Privileged job only."
  labels: [approval, supervisor, admin, privileged, linux]

- id: approval/admin/superseded
  title: "the first answer wins and a later one is superseded"
  category: approval
  tier: P1
  guarantee: "Two approvers answer one request. The first answer decides it, the second approver is told the request was answered first, and the requester's next hook reports the first answer with its note. Privileged job only."
  labels: [approval, supervisor, admin, privileged, linux]

- id: approval/local-auth/password-required
  title: "the service asks the approver for their password on a host with polkit"
  category: approval
  tier: P0
  guarantee: "On a host with polkit, the decision service asks the approver for their password through polkit before it takes the answer. pkttyagent asks on the terminal of gryph policy approve resolve. The right password makes the answer local-auth and stores the grant. A wrong password leaves the request pending. Privileged job with polkit only."
  labels: [approval, supervisor, local-auth, privileged, linux]

- id: approval/local-auth/pty-agent-refused
  title: "an agent that types on a pseudo terminal cannot pass the password prompt"
  category: approval
  tier: P0
  guarantee: "An answer whose password prompt gets no valid password is refused and the request stays pending. Only policy.approval.local_admin.allow_without_auth in the managed configuration waives the password, and the answer then counts at a lower assurance than local-auth. Privileged job with polkit only."
  labels: [approval, supervisor, local-auth, privileged, linux]

- id: approval/low-trust/deferral-only
  title: "an escalation from a low-trust connection asks nobody on the terminal"
  category: approval
  tier: P0
  guarantee: "A session binds to the first known agent process above its hooks. A hook of the same session from outside that agent, while it lives, is low trust: an escalate rule that accepts the terminal gets no prompt, the request waits for an approver above the terminal, and the receipt and the request record the trust. Privileged job only."
  labels: [approval, supervisor, trust, privileged, linux]

- id: context/low-trust/prompt-no-reset
  title: "a prompt from a low-trust connection does not become the latest intent"
  category: context
  tier: P0
  guarantee: "A prompt from a connection outside the agent the session is bound to is recorded as an observation with peer_trust low. It does not become the latest intent and does not reset context.actions_since_intent. A prompt under the agent does. Privileged job only."
  labels: [context, supervisor, trust, privileged, linux]

- id: supervisor/install/ordering
  title: "the managed install turns the service switch on only after the service answers"
  category: supervisor
  tier: P0
  guarantee: "gryph install --managed with supervisor.enabled writes the configuration with the switch off, makes the service account, the keys and the spool root, writes the hardened socket and service units, and turns the switch on only after the service answered over the socket. A service that does not answer leaves the switch off and the run partial. gryph uninstall --managed clears the switch first and then removes the units. Privileged job only."
  labels: [supervisor, install, privileged, linux]

- id: install/purge/data-removed
  title: "purge removes the database and config, dry-run changes nothing"
  category: install
  tier: P1
  guarantee: "gryph uninstall --purge deletes the database and config and keeps foreign hooks. The --dry-run form previews without changing anything."
  labels: [install, uninstall, purge]

- id: audit/self-log/actions-recorded
  title: "gryph records its own actions and keeps them through cleanup"
  category: audit
  tier: P1
  guarantee: "Install, config change, and uninstall each leave a self-log row, and retention cleanup never deletes self-audit rows."
  labels: [self-audit, retention]

- id: policy/escalate/nop-fails-closed
  title: "an escalate with no approval frontend denies"
  category: policy
  tier: P0
  guarantee: "An escalate decision under approval mode nop denies the action, records the denial in the approval history, and leaves approval self-audit rows."
  labels: [policy, escalate, approval]

- id: policy/context/counter-condition-fires
  title: "a CEL counter condition fires at the threshold"
  category: policy
  tier: P0
  guarantee: "A rule with a context counter condition stays quiet below the threshold and blocks once the session counter crosses it."
  labels: [policy, cel, context]

- id: policy/context/chain-verifies-clean
  title: "the context chain verifies over a real session"
  category: policy
  tier: P1
  guarantee: "gryph policy context --verify passes with zero breaks after a real mixed session. An insert versus recompute mismatch fails here without tampering."
  labels: [policy, context, chain]

- id: session/lifecycle/end-and-subagents
  title: "session end closes the session and subagent attribution persists"
  category: session
  tier: P1
  guarantee: "A session end hook sets the session end time, and subagent events keep their subagent id and type through to the export."
  labels: [session, subagent]

- id: hook/session/project-claim
  title: "the hook process names the project of the working directory"
  category: hook
  tier: P1
  guarantee: "A hook payload with a working directory makes the session record the project name from its manifest, or the directory name when there is no manifest."
  labels: [hook, session, project]

- id: hook/ingest/allow-matrix
  title: "every agent's read and write events persist correctly"
  category: hook
  tier: P1
  guarantee: "A read and a write payload for each supported agent parse and persist with the correct action type."
  labels: [hook, ingest, protocols]

- id: reconcile/detect/hook-removed
  title: "a reconcile pass detects a removed hook entry and changes nothing"
  category: reconcile
  tier: P0
  guarantee: "gryph supervisor reconcile --once reports a removed hook entry as drift, records one tamper event, leaves the file as it is when repair is off, and records nothing on a repeated pass."
  labels: [reconcile, detect, selfprotect]

- id: reconcile/repair/hook-restored
  title: "a reconcile pass with repair on restores the Gryph hook entries"
  category: reconcile
  tier: P0
  guarantee: "With policy.self_protection.repair on, or with --repair, a reconcile pass rewrites the Gryph entries of a changed hook configuration, keeps the user's other settings, and records the repair as a tamper event with a receipt."
  labels: [reconcile, repair, selfprotect]

- id: reconcile/repair/symlink-no-write
  title: "a repair refuses a hook configuration that is a symbolic link"
  category: reconcile
  tier: P0
  guarantee: "A repair of a hook configuration that is a symbolic link fails, leaves the target of the link unchanged, and records a repair_failed tamper event."
  labels: [reconcile, repair, selfprotect, symlink]

- id: reconcile/repair/invalid-json-no-clobber
  title: "a repair leaves a hook configuration that does not parse"
  category: reconcile
  tier: P0
  guarantee: "A repair of a hook configuration that does not parse fails and leaves the file byte for byte as it was, for every agent, also one whose human-run install replaces a malformed file."
  labels: [reconcile, repair, selfprotect]

- id: reconcile/repair/rate-limit
  title: "a reconcile pass stops repairing an asset after three repairs in an hour"
  category: reconcile
  tier: P1
  guarantee: "After three repairs of one hook configuration within an hour, a reconcile pass leaves it as it is, reports the rate limit, and records one rate_limited tamper event."
  labels: [reconcile, repair, selfprotect]

- id: reconcile/units/installed
  title: "install --managed writes the system-wide reconcile job for every account"
  category: reconcile
  tier: P1
  guarantee: "gryph install --managed writes the systemd user units under /etc/systemd/user that run gryph supervisor reconcile --once as each account at login and every 15 minutes, with the managed binary as the program. gryph uninstall --managed removes them. Privileged job only."
  labels: [reconcile, managed, privileged, linux]

- id: reconcile/timer/units-written
  title: "install --repair-timer writes the reconcile timer units and uninstall removes them"
  category: reconcile
  tier: P2
  guarantee: "On Linux, gryph install --repair-timer writes the systemd user service and timer that run gryph supervisor reconcile --once every 15 minutes, exits zero when the scheduler is out of reach, and gryph uninstall --repair-timer removes the units."
  labels: [reconcile, timer, linux]

- id: receipts/signing/key-scope
  title: "a user-key signature carries the key scope user"
  category: receipts
  tier: P1
  guarantee: "A receipt signed with a key in the user's config directory carries signer_key_scope user. The receipt list, the JSONL and CSV exports, gryph policy receipts --verify and verify-log print the scope, so an audit does not read the signature as one of the decision service."
  labels: [receipts, signing, key-scope]

- id: receipts/managed/trust-store
  title: "install --managed --trust-store ships the fleet trust store"
  category: receipts
  tier: P1
  guarantee: "gryph install --managed --trust-store writes the administrator's receipt trust store to the managed keys directory, root-owned 0644, and refuses an invalid one with exit 3. Every user's verifier and gryph policy keys list trust its keys next to the user's own store, a user key command writes the user's store only, and gryph doctor --managed reports the store. Privileged job only."
  labels: [receipts, managed, privileged, linux]

- id: receipts/system-session/verify
  title: "tamper events are receipts in the system session and the chain verifies"
  category: receipts
  tier: P0
  guarantee: "gryph doctor records a tamper event with a receipt in the account's system session when a hook configuration drifts, when the drift clears, and not on a repeated run. gryph policy receipts --verify and verify-log pass on the chain."
  labels: [receipts, selfprotect, tamper]

- id: doctor/census/silent-agent
  title: "doctor reports a live agent with no hook traffic as a silent agent"
  category: doctor
  tier: P1
  guarantee: "A process named like an agent program that runs through the census window with no hook event is drift on the hook_traffic row and a silent_agent tamper event. A hook call clears it, as a resolved tamper event."
  labels: [doctor, census, selfprotect]

- id: doctor/managed/json-contract
  title: "doctor --managed prints the compliance report with a stable JSON contract"
  category: doctor
  tier: P0
  guarantee: "gryph doctor --managed reports schema_version, profile, issues, the config, policy and binary chain state, the per-agent class and level, the key scope, the supervisor state and the collection level. It exits 0 only for the locked profile, and it refuses a binary that root does not own. Privileged job only."
  labels: [doctor, managed, privileged, linux]

- id: doctor/posture/report
  title: "doctor reports the host posture"
  category: doctor
  tier: P1
  guarantee: "gryph doctor prints a host posture section with the Linux kernel settings that decide how far a same-user adversary gets, and for each present agent what it does when a hook fails, with its hook timeout and, for Cursor, the failClosed state."
  labels: [doctor, posture]

- id: doctor/selfprotect/asset-table
  title: "doctor prints the self-protection level of every asset and the profile"
  category: doctor
  tier: P0
  guarantee: "gryph doctor prints one row per Gryph asset with its level and detail, a drift line when a hook configuration differs from a current install, and the profile the levels earn: none with policy off, guard with policy on."
  labels: [doctor, selfprotect]

- id: health/doctor/unhealthy-flagged
  title: "doctor flags a missing database and invalid hooks"
  category: health
  tier: P1
  guarantee: "gryph doctor warns with a suggestion when the database is missing and when an agent's hook set is invalid."
  labels: [doctor]

- id: config/set/rejects-unknown-key
  title: "config set rejects an unknown key and leaves the file unchanged"
  category: config
  tier: P1
  guarantee: "gryph config set on a known key writes the file. On an unknown key it exits 2, names the unknown key on stderr, and leaves the file unchanged."
  labels: [config]

- id: config/set/out-of-range-context
  title: "config set works when the file holds an out-of-range policy.context value"
  category: config
  tier: P1
  guarantee: "An out-of-range policy.context value in the file does not block gryph config set on another key. A set of an out-of-range policy.context value exits 2."
  labels: [config, policy]

- id: config/env/override-wins
  title: "a GRYPH_ environment variable overrides the config file"
  category: config
  tier: P2
  guarantee: "A GRYPH_ prefixed environment variable overrides the file value at runtime for logging level and retention."
  labels: [config, env]

- id: events/diff/unified-by-id
  title: "diff and cat show event detail by id or prefix"
  category: events
  tier: P2
  guarantee: "gryph diff <event-id> prints a unified diff for a file_write event and gryph cat <event-id> shows the event detail, with prefix match."
  labels: [diff, cat]

- id: hook/robustness/malformed-input-never-blocks
  title: "malformed hook input never blocks the agent"
  category: hook
  tier: P0
  guarantee: "Malformed hook input exits 1, never 2, with or without policy, and leaves a hook_error self-audit row. Unknown hook types are ignored at exit 0."
  labels: [hook, robustness]

- id: hook/robustness/concurrent-writes
  title: "concurrent hooks lose no events or receipts"
  category: hook
  tier: P0
  guarantee: "Twelve concurrent hook processes with policy enabled all succeed, every event and receipt persists, and the receipt and context chains verify."
  labels: [hook, robustness, concurrency, policy]

- id: policy/precedence/block-beats-allow
  title: "an installed allow cannot defeat a block"
  category: policy
  tier: P0
  guarantee: "An installed file with a broad allow rule cannot override a block from another file, and disabled: cannot reach a rule declared in a different file."
  labels: [policy, precedence, threat-model]

- id: storage/upgrade/pre-context-v2-db-opens
  title: "a release database with old context tables opens and chains new entries"
  category: storage
  tier: P0
  guarantee: "A database from the last release, written with the policy layer on, opens under the current binary. Each session keeps its tools, classes and network count. The old entry log is dropped, the audit events stay, and new context entries verify from sequence 1."
  labels: [storage, upgrade, context]

- id: context/counters/pre-post-counted-once
  title: "a pre and post hook pair counts as one action"
  category: context
  tier: P0
  guarantee: "A pre and post hook pair for one tool call adds one to the session counters and to context.total_actions. The post event is an observation."
  labels: [context, counters]

- id: context/counters/post-only-counted
  title: "a post hook with no pre hook counts as an action"
  category: context
  tier: P1
  guarantee: "A post hook with no recorded pre hook for its tool call adds one to the session counters."
  labels: [context, counters]

- id: context/chain/v2-tamper-detected
  title: "a changed context entry breaks the version 2 chain"
  category: context
  tier: P0
  guarantee: "Context entries chain with hash version 2. A change to a hashed fact of a stored entry makes policy context --verify fail."
  labels: [context, chain, tamper]

- id: storage/upgrade/previous-release-db-opens
  title: "a previous release's database survives the upgrade"
  category: storage
  tier: P0
  guarantee: "A database written by the previous release opens under the current binary, events stay queryable, the schema migrates, and new events append. Old content exports as unclassified, and new content does not."
  labels: [storage, upgrade, privacy]

- id: install/idempotent/reinstall-no-duplicates
  title: "reinstall keeps exactly one gryph entry per hook type"
  category: install
  tier: P1
  guarantee: "A plain reinstall is a no-op that keeps one gryph entry per hook type and keeps foreign hooks. A --force reinstall replaces the hook types gryph owns and keeps settings outside the hooks section."
  labels: [install, idempotent]

- id: policy/dry-run/matches-enforcement
  title: "the policy dry run predicts enforcement"
  category: policy
  tier: P1
  guarantee: "For one policy, gryph policy test and the real hook return the same decision for the same action."
  labels: [policy, dry-run]

- id: policy/authoring/duplicate-rule-id-refused
  title: "policy install refuses a duplicate rule id"
  category: policy
  tier: P1
  guarantee: "A candidate file whose rule id collides with the active policy is refused with a clear error and is not copied into policies/."
  labels: [policy, authoring]

- id: policy/enrichment/classification-and-injection-block
  title: "classification and injection enrichers drive CEL conditions"
  category: policy
  tier: P1
  guarantee: "A command is blocked after the session reads a secret-classified path, and a tool call with prompt injection markers is blocked while a benign one passes."
  labels: [policy, classify, injection]

- id: migration/layout/legacy-tree-moves
  title: "a pre safedep/gryph install moves to the new layout on first run"
  category: migration
  tier: P0
  guarantee: "The first run moves the legacy gryph config and data directories to the safedep/gryph layout, renames config.yaml to config.yml, keeps the stored state intact, and records a path_migration self-audit entry."
  labels: [migration, config, storage]

- id: migration/layout/env-override-normalizes
  title: "GRYPH_CONFIG_DIR is used as-is and its config name is normalized"
  category: migration
  tier: P1
  guarantee: "GRYPH_CONFIG_DIR names the final config directory with no leaf appended. The directory is not moved, and a config.yaml inside it is renamed to config.yml."
  labels: [migration, config, env]

- id: migration/layout/both-exist-new-wins
  title: "when legacy and new directories both exist, the new one wins"
  category: migration
  tier: P1
  guarantee: "When the legacy and the new config directory both exist, gryph reads the new directory, merges nothing, and leaves the legacy directory in place."
  labels: [migration, config]

