  guarantee: "A Command Code session has no intent. A rule on !context.intent_available fires, and policy context shows intent_available false."
  labels: [context, intent]

- id: install/claude-code/prompt-hook-written
  title: "install writes the Claude Code prompt hook"
  category: install
  tier: P1
  guarantee: "gryph install --agent claude-code writes a UserPromptSubmit hook entry, and doctor reports the hooks as valid."
  labels: [install, prompt]

- id: health/doctor/plugin-changed
  title: "doctor flags a changed plugin that keeps the hook names"
  category: health
  tier: P1
  guarantee: "gryph doctor reports an OpenCode plugin as invalid unless it equals the current plugin or a known released plugin, and suggests install --force."
  labels: [doctor]

- id: health/doctor/prompt-hook-missing
  title: "doctor warns when the prompt hook is missing"
  category: health
  tier: P2
  guarantee: "An install without the prompt hook stays valid. Doctor warns that the prompt hook is not installed and suggests a reinstall."
  labels: [doctor, prompt]

- id: context/intent/agent-matrix
  title: "every agent's prompt hook records and blocks a prompt"
  category: context
  tier: P1
  guarantee: "Claude Code, Cursor, Gemini CLI, Codex, Devin, Windsurf, OpenCode and Pi record a prompt as a user_prompt event, and a content rule on user_prompt blocks it with the agent's block response."
  labels: [context, intent, prompt, protocols]

- id: install/all-agents/prompt-hooks-written
  title: "install writes the prompt hook of every agent"
  category: install
  tier: P1
  guarantee: "One gryph install writes the prompt hook of every agent that has one: UserPromptSubmit, beforeSubmitPrompt, BeforeAgent, pre_user_prompt, chat.message and the Pi input event."
  labels: [install, prompt]

- id: context/tags/allow-rule-tags-event
  title: "an allow rule with tags labels an event for later rules"
  category: context
  tier: P0
  guarantee: "A rule with action allow and tags labels the event and does not change the decision. The entry stores the tag, tags_seen records its first sequence, and a later rule on context.tags_seen blocks."
  labels: [context, tags, policy]

- id: context/tags/all-matched-rules-tag
  title: "every matched rule adds its tags to the entry"
  category: context
  tier: P1
  guarantee: "The context entry stores the union of the tags of every matched rule, at any decision, not only the tags of the winning rule."
  labels: [context, tags, policy]

- id: context/tags/content-pattern-on-observation
  title: "content_patterns on an observation read the tool output"
  category: context
  tier: P1
  guarantee: "For a post event, content_patterns read the tool output. A tag rule on action.kind observation tags a command whose output holds an AWS key."
  labels: [context, tags, observation]

- id: context/observation/origin-recorded
  title: "the context records the origin of content"
  category: context
  tier: P1
  guarantee: "A web tool gives the origin web, an mcp__<server>__ tool gives mcp with the server, and a read outside the working directory gives file_external. The entry, origins_seen, action.origin, action.source and the output label carry it."
  labels: [context, observation, origin]

- id: context/observation/ambiguous-mcp-server
  title: "a rule that denies an MCP server matches an ambiguous tool name"
  category: context
  tier: P1
  guarantee: "An mcp__ tool name with __ in the tool part leaves action.source empty, puts every server reading in action.sources, and adds mcp:<server> to origins_seen for each reading."
  labels: [context, observation, origin]

- id: policy/validate/tag-name-format
  title: "policy validation rejects a bad tag name"
  category: policy
  tier: P2
  guarantee: "gryph policy validate accepts lower-case tag names with digits, underscores and hyphens, and rejects any other name with the rule and the tag in the message. An installed policy with a legacy tag still loads and enforces."
  labels: [policy, tags, validate]

- id: context/dataflow/example-policy-blocks-exfiltration
  title: "the example policy blocks egress after a secret read"
  category: context
  tier: P0
  guarantee: "The shipped secret-exfiltration example policy installs, lets a network command before a secret read pass, and blocks a command that contacts a host after a read of .env. It also blocks one command that reads a secret and contacts a host, including a read of ~/.ssh and a host that xargs gives to curl."
  labels: [context, dataflow, tags, examples]

- id: context/cel/entries-query
  title: "a rule reads the entry log with glob()"
  category: context
  tier: P1
  guarantee: "context.entries holds the latest entries with their paths, and glob(path, pattern) matches a path. A rule blocks a write after a .pem read."
  labels: [context, cel]

- id: context/counters/failed-call-counts-error
  title: "a failed tool call counts one error"
  category: context
  tier: P1
  guarantee: "A pre hook and a failed post hook count one action and one error, and a rule on context.errors sees the error on the next call."
  labels: [context, counters]

- id: policy/test/context-file
  title: "policy test reads a session context from a file"
  category: policy
  tier: P1
  guarantee: "gryph policy test --context-file evaluates a rule on tags_seen and entries from a YAML file, --kind and --origin set the action facts, and an unknown key in the file is an error."
  labels: [policy, test, context]

- id: policy/validate/semantic-drift-removed
  title: "a policy on semantic_drift fails validation"
  category: policy
  tier: P2
  guarantee: "context.semantic_drift is removed. Policy validation rejects a policy that reads it, also through an alias, with a message that names the field. An installed policy that reads it still loads, reads it as zero, and enforces."
  labels: [policy, validate]

- id: context/window/content-by-level
  title: "the window prints content stored at the full level only"
  category: context
  tier: P0
  guarantee: "gryph policy context --window --content prints content stored at full. For an event stored at standard it prints the digest only, also after the config changes to full. It never prints the content of a sensitive path."
  labels: [context, window, privacy]

- id: context/window/keeps-latest-intent
  title: "the window keeps the latest prompt"
  category: context
  tier: P2
  guarantee: "With --limit 3 and ten actions after a prompt, the window still holds the prompt."
  labels: [context, window, intent]
