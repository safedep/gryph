# Guarantee inventory for the gryph acceptance suite. One entry per guarantee.
# Coverage is derived: a script whose path id matches means covered. Never
# author a coverage field.
#
# The category is the first path segment of the script id.
# The tier is P0 (incident) | P1 (important) | P2 (tracked).
# Labels are free-form tags. A run can filter by category and by labels.

- id: install/claude-code/hooks-written
  title: "gryph install writes Claude Code hooks and keeps foreign entries"
  category: install
  tier: P0
  guarantee: "gryph install --agent claude-code adds gryph hook entries to ~/.claude/settings.json and keeps pre-existing hooks and settings."
  labels: [install, claude-code]

- id: install/uninstall/round-trip
  title: "gryph uninstall removes only gryph hooks and restores backups"
  category: install
  tier: P0
  guarantee: "gryph uninstall removes gryph hook entries, keeps foreign hooks, writes a backup on install, and --restore-backup brings the original file back."
  labels: [install, uninstall, backup, claude-code]

- id: hook/ingest/event-persisted
  title: "a hook payload becomes a queryable event in one session"
  category: hook
  tier: P0
  guarantee: "gryph _hook parses a real agent payload from stdin, exits zero, persists the event, and maps repeated payloads of one agent session to one gryph session."
  labels: [hook, ingest, claude-code]

- id: policy/block/dangerous-command
  title: "a policy block rule stops the action with the agent's protocol"
  category: policy
  tier: P0
  guarantee: "A matching block rule makes the Claude Code hook exit 2 with the reason, makes the Cursor hook exit 0 with a deny JSON on stdout, and persists the event as blocked."
  labels: [policy, block, claude-code, cursor]

- id: policy/self-protection/config-write-blocked
  title: "builtin self-protection blocks writes to gryph and hook config"
  category: policy
  tier: P0
  guarantee: "With policy enabled, an agent write to the gryph config directory or an agent hook config file is blocked by the builtin rules. A shell command that removes the config directory in bash -euo pipefail -c is blocked too."
  labels: [policy, self-protection]

- id: policy/self-protection/command-code-hookcfg-blocked
  title: "builtin self-protection blocks Command Code hook config changes"
  category: policy
  tier: P0
  guarantee: "With policy enabled, a Command Code write or edit of ~/.commandcode/settings.json, and a shell command that removes, redirects into, or edits it in place, is blocked by the builtin rules."
  labels: [policy, self-protection, command-code]

- id: policy/self-protection/database-read-blocked
  title: "builtin self-protection blocks reads of the gryph database and signing key"
  category: policy
  tier: P0
  guarantee: "With policy enabled, an agent read of the database, its WAL or SHM file, or the receipt signing key is blocked. A Grep of the data directory, of the config directory, or of the config parent directory is blocked. sqlite3, cat, cp, base64, and cd-then-read commands that read them are blocked. A read of a project file or an agent hook config, and a Grep of the home directory, pass."
  labels: [policy, self-protection]

- id: policy/self-protection/hook-command-blocked
  title: "builtin self-protection blocks agent shell commands that run gryph _hook"
  category: policy
  tier: P0
  guarantee: "With policy enabled, an agent shell command that runs gryph _hook with a literal _hook argument, directly, in a nested shell (also after a flag group such as -euo pipefail), or through ANSI-C quoting, is blocked at exit 2, so it cannot forge a user prompt. Another gryph command passes, also with a variable argument. A grep for a word that holds _hook passes."
  labels: [policy, self-protection, intent]

- id: policy/file-access/read-rule-matches-shell-reads
  title: "file_access selects which shell targets a file rule matches"
  category: policy
  tier: P1
  guarantee: "A rule with file_access [read] blocks a shell read of a matching path and passes a shell write. A rule without file_access blocks a shell write and passes a shell read."
  labels: [policy]

- id: privacy/redaction/digest-before-redact
  title: "redaction keeps the digest of the original value"
  category: privacy
  tier: P1
  guarantee: "A command with a matched token stores [REDACTED], sets redacted to true in its label, and keeps the digest of the original value in the local store. Export drops that digest."
  labels: [privacy, labels]

- id: privacy/sensitive/content-never-stored
  title: "sensitive file content never reaches storage or export"
  category: privacy
  tier: P0
  guarantee: "A write to a sensitive path is flagged, its content is not stored at any logging level, and export excludes the event unless --sensitive is set. The exported label keeps the secret class and the stripped flag, and drops the digest."
  labels: [privacy, sensitive, redaction, export]

- id: receipts/verify-log/tamper-fails
  title: "receipt log verification detects tampering"
  category: receipts
  tier: P1
  guarantee: "gryph policy receipts verify-log exits zero on an untampered export and exits non-zero after one field changes."
  labels: [policy, receipts, aarm]

- id: export/schema/jsonl-stable
  title: "export emits schema-tagged JSONL with a clean stdout"
  category: export
  tier: P1
  guarantee: "gryph export writes one JSON object per line with a $schema field and prints the summary to stderr only."
  labels: [export, jsonl, automation]

- id: errors/exit-codes/contract
  title: "documented exit codes hold on the real binary"
  category: errors
  tier: P1
  guarantee: "An unknown agent exits 4 and an invalid configuration exits 2, with the error on stderr."
  labels: [errors, exit-codes]

- id: health/status-doctor/healthy
  title: "status and doctor report a healthy installation"
  category: health
  tier: P1
  guarantee: "After install, gryph status shows the agent as installed and gryph doctor exits zero with passing checks."
  labels: [status, doctor]

- id: policy/fail-mode/closed-on-broken-policy
  title: "a broken policy fails closed, never silently off"
  category: policy
  tier: P0
  guarantee: "With fail_mode closed, a policy that does not load blocks the action and records a policy_load_error self-audit. With fail_mode open the action passes."
  labels: [policy, fail-mode, self-audit]

- id: policy/authoring/install-multi-file
  title: "policy validate, install, and list work end to end"
  category: policy
  tier: P0
  guarantee: "gryph policy validate --file checks a draft, policy install copies it into policies/, policy list shows the merged sources, and the installed rule enforces."
  labels: [policy, authoring]

- id: install/all-agents/files-written
  title: "one install covers every detected agent's documented file"
  category: install
  tier: P0
  guarantee: "gryph install writes each detected agent's hook file as documented, and gryph uninstall removes every gryph entry and generated file."
  labels: [install, all-agents]

- id: hook/protocols/block-matrix
  title: "every agent protocol refuses a blocked action"
  category: hook
  tier: P0
  guarantee: "A block decision reaches gemini, opencode, windsurf, pi-agent, and codex through each protocol's exit code and response channel, and every event persists as blocked."
  labels: [policy, block, protocols]

- id: policy/defer/timeout-resolves-deny
  title: "a deferred action resolves by decision or times out to deny"
  category: policy
  tier: P0
  guarantee: "A defer decision blocks the action and queues it. A human resolves it with a decision. The sweep resolves an expired deferral to timeout, which denies."
  labels: [policy, defer]

- id: policy/guidance/advisory-delivered
  title: "a guidance rule advises without blocking"
  category: policy
  tier: P1
  guarantee: "A guidance decision exits zero, delivers the advisory on the agent's channel, and persists the event as success."
  labels: [policy, guidance, claude-code, cursor]

- id: receipts/signing/key-round-trip
  title: "signed receipts verify and a tampered signature fails"
  category: receipts
  tier: P1
  guarantee: "After keys generate, receipts are signed, verify-log validates them against the trust store, and a tampered signature fails verification with a non-zero exit."
  labels: [policy, receipts, signing]

- id: cost/tokens/from-transcript
  title: "session end collects token usage from the transcript"
  category: cost
  tier: P1
  guarantee: "A session end hook with a transcript path makes gryph cost report the session's tokens and model."
  labels: [cost, tokens]

- id: install/purge/data-removed
  title: "purge removes the database and config, dry-run changes nothing"
  category: install
  tier: P1
  guarantee: "gryph uninstall --purge deletes the database and config and keeps foreign hooks. The --dry-run form previews without changing anything."
  labels: [install, uninstall, purge]

- id: audit/self-log/actions-recorded
  title: "gryph records its own actions and keeps them through cleanup"
  category: audit
  tier: P1
  guarantee: "Install, config change, and uninstall each leave a self-log row, and retention cleanup never deletes self-audit rows."
  labels: [self-audit, retention]

- id: policy/escalate/nop-fails-closed
  title: "an escalate with no approval frontend denies"
  category: policy
  tier: P0
  guarantee: "An escalate decision under approval mode nop denies the action, records the denial in the approval history, and leaves approval self-audit rows."
  labels: [policy, escalate, approval]

- id: policy/context/counter-condition-fires
  title: "a CEL counter condition fires at the threshold"
  category: policy
  tier: P0
  guarantee: "A rule with a context counter condition stays quiet below the threshold and blocks once the session counter crosses it."
  labels: [policy, cel, context]

- id: policy/context/chain-verifies-clean
  title: "the context chain verifies over a real session"
  category: policy
  tier: P1
  guarantee: "gryph policy context --verify passes with zero breaks after a real mixed session. An insert versus recompute mismatch fails here without tampering."
  labels: [policy, context, chain]

- id: session/lifecycle/end-and-subagents
  title: "session end closes the session and subagent attribution persists"
  category: session
  tier: P1
  guarantee: "A session end hook sets the session end time, and subagent events keep their subagent id and type through to the export."
  labels: [session, subagent]

- id: hook/ingest/allow-matrix
  title: "every agent's read and write events persist correctly"
  category: hook
  tier: P1
  guarantee: "A read and a write payload for each supported agent parse and persist with the correct action type."
  labels: [hook, ingest, protocols]

- id: health/doctor/unhealthy-flagged
  title: "doctor flags a missing database and invalid hooks"
  category: health
  tier: P1
  guarantee: "gryph doctor warns with a suggestion when the database is missing and when an agent's hook set is invalid."
  labels: [doctor]

- id: config/set/rejects-unknown-key
  title: "config set rejects an unknown key and leaves the file unchanged"
  category: config
  tier: P1
  guarantee: "gryph config set on a known key writes the file. On an unknown key it exits 2, names the unknown key on stderr, and leaves the file unchanged."
  labels: [config]

- id: config/env/override-wins
  title: "a GRYPH_ environment variable overrides the config file"
  category: config
  tier: P2
  guarantee: "A GRYPH_ prefixed environment variable overrides the file value at runtime for logging level and retention."
  labels: [config, env]

- id: events/diff/unified-by-id
  title: "diff and cat show event detail by id or prefix"
  category: events
  tier: P2
  guarantee: "gryph diff <event-id> prints a unified diff for a file_write event and gryph cat <event-id> shows the event detail, with prefix match."
  labels: [diff, cat]

- id: hook/robustness/malformed-input-never-blocks
  title: "malformed hook input never blocks the agent"
  category: hook
  tier: P0
  guarantee: "Malformed hook input exits 1, never 2, with or without policy, and leaves a hook_error self-audit row. Unknown hook types are ignored at exit 0."
  labels: [hook, robustness]

- id: hook/robustness/concurrent-writes
  title: "concurrent hooks lose no events or receipts"
  category: hook
  tier: P0
  guarantee: "Twelve concurrent hook processes with policy enabled all succeed, every event and receipt persists, and the receipt and context chains verify."
  labels: [hook, robustness, concurrency, policy]

- id: policy/precedence/block-beats-allow
  title: "an installed allow cannot defeat a block"
  category: policy
  tier: P0
  guarantee: "An installed file with a broad allow rule cannot override a block from another file, and disabled: cannot reach a rule declared in a different file."
  labels: [policy, precedence, threat-model]

- id: storage/upgrade/pre-context-v2-db-opens
  title: "a release database with old context tables opens and chains new entries"
  category: storage
  tier: P0
  guarantee: "A database from the last release, written with the policy layer on, opens under the current binary. Each session keeps its tools, classes and network count. The old entry log is dropped, the audit events stay, and new context entries verify from sequence 1."
  labels: [storage, upgrade, context]

- id: context/counters/pre-post-counted-once
  title: "a pre and post hook pair counts as one action"
  category: context
  tier: P0
  guarantee: "A pre and post hook pair for one tool call adds one to the session counters and to context.total_actions. The post event is an observation."
  labels: [context, counters]

- id: context/counters/post-only-counted
  title: "a post hook with no pre hook counts as an action"
  category: context
  tier: P1
  guarantee: "A post hook with no recorded pre hook for its tool call adds one to the session counters."
  labels: [context, counters]

- id: context/chain/v2-tamper-detected
  title: "a changed context entry breaks the version 2 chain"
  category: context
  tier: P0
  guarantee: "Context entries chain with hash version 2. A change to a hashed fact of a stored entry makes policy context --verify fail."
  labels: [context, chain, tamper]

- id: storage/upgrade/previous-release-db-opens
  title: "a previous release's database survives the upgrade"
  category: storage
  tier: P0
  guarantee: "A database written by the previous release opens under the current binary, events stay queryable, the schema migrates, and new events append."
  labels: [storage, upgrade]

- id: install/idempotent/reinstall-no-duplicates
  title: "reinstall keeps exactly one gryph entry per hook type"
  category: install
  tier: P1
  guarantee: "A plain reinstall is a no-op that keeps one gryph entry per hook type and keeps foreign hooks. A --force reinstall replaces the hook types gryph owns and keeps settings outside the hooks section."
  labels: [install, idempotent]

- id: policy/dry-run/matches-enforcement
  title: "the policy dry run predicts enforcement"
  category: policy
  tier: P1
  guarantee: "For one policy, gryph policy test and the real hook return the same decision for the same action."
  labels: [policy, dry-run]

- id: policy/authoring/duplicate-rule-id-refused
  title: "policy install refuses a duplicate rule id"
  category: policy
  tier: P1
  guarantee: "A candidate file whose rule id collides with the active policy is refused with a clear error and is not copied into policies/."
  labels: [policy, authoring]

- id: policy/enrichment/classification-and-injection-block
  title: "classification and injection enrichers drive CEL conditions"
  category: policy
  tier: P1
  guarantee: "A command is blocked after the session reads a secret-classified path, and a tool call with prompt injection markers is blocked while a benign one passes."
  labels: [policy, classify, injection]

- id: migration/layout/legacy-tree-moves
  title: "a pre safedep/gryph install moves to the new layout on first run"
  category: migration
  tier: P0
  guarantee: "The first run moves the legacy gryph config and data directories to the safedep/gryph layout, renames config.yaml to config.yml, keeps the stored state intact, and records a path_migration self-audit entry."
  labels: [migration, config, storage]

- id: migration/layout/env-override-normalizes
  title: "GRYPH_CONFIG_DIR is used as-is and its config name is normalized"
  category: migration
  tier: P1
  guarantee: "GRYPH_CONFIG_DIR names the final config directory with no leaf appended. The directory is not moved, and a config.yaml inside it is renamed to config.yml."
  labels: [migration, config, env]

- id: migration/layout/both-exist-new-wins
  title: "when legacy and new directories both exist, the new one wins"
  category: migration
  tier: P1
  guarantee: "When the legacy and the new config directory both exist, gryph reads the new directory, merges nothing, and leaves the legacy directory in place."
  labels: [migration, config]

# --- gaps: tracked guarantees with no script yet ---

- id: retention/cleanup/old-events-deleted
  title: "retention cleanup deletes events past the cutoff"
  category: retention
  tier: P2
  guarantee: "gryph retention cleanup deletes events older than the configured retention and reports the count, and --dry-run only previews."
  labels: [retention]

- id: context/intent/prompt-recorded
  title: "a user prompt is recorded as an intent"
  category: context
  tier: P0
  guarantee: "A Claude Code UserPromptSubmit hook records a user_prompt event and an intent entry. The intent is not an action. The next action sees intent_available true and one action since the intent."
  labels: [context, intent, prompt]

- id: context/intent/prompt-rule-blocks
  title: "a content rule on user_prompt blocks the prompt"
  category: context
  tier: P1
  guarantee: "A block rule with action_types [user_prompt] and content_patterns blocks a matching prompt at exit 2 with the rule message. A prompt that does not match passes."
  labels: [context, intent, prompt, policy]

- id: context/intent/escalated-prompt-denied
  title: "a denied escalated prompt does not become the latest intent"
  category: context
  tier: P1
  guarantee: "A user_prompt escalate rule with the default nop approval denies the prompt at exit 2. The denied prompt does not reset actions_since_intent, and a rule on actions_since_intent still blocks the next command."
  labels: [context, intent, prompt, policy, escalate]

- id: context/intent/unavailable
  title: "an agent with no prompt hook has no intent"
  category: context
  tier: P1
  guarantee: "A Command Code session has no intent. A rule on !context.intent_available fires, and policy context shows intent_available false."
  labels: [context, intent]

- id: install/claude-code/prompt-hook-written
  title: "install writes the Claude Code prompt hook"
  category: install
  tier: P1
  guarantee: "gryph install --agent claude-code writes a UserPromptSubmit hook entry, and doctor reports the hooks as valid."
  labels: [install, prompt]

- id: health/doctor/plugin-changed
  title: "doctor flags a changed plugin that keeps the hook names"
  category: health
  tier: P1
  guarantee: "gryph doctor reports an OpenCode plugin as invalid unless it equals the current plugin or a known released plugin, and suggests install --force."
  labels: [doctor]

- id: health/doctor/prompt-hook-missing
  title: "doctor warns when the prompt hook is missing"
  category: health
  tier: P2
  guarantee: "An install without the prompt hook stays valid. Doctor warns that the prompt hook is not installed and suggests a reinstall."
  labels: [doctor, prompt]

- id: context/intent/agent-matrix
  title: "every agent's prompt hook records and blocks a prompt"
  category: context
  tier: P1
  guarantee: "Claude Code, Cursor, Gemini CLI, Codex, Devin, Windsurf, OpenCode and Pi record a prompt as a user_prompt event, and a content rule on user_prompt blocks it with the agent's block response."
  labels: [context, intent, prompt, protocols]

- id: install/all-agents/prompt-hooks-written
  title: "install writes the prompt hook of every agent"
  category: install
  tier: P1
  guarantee: "One gryph install writes the prompt hook of every agent that has one: UserPromptSubmit, beforeSubmitPrompt, BeforeAgent, pre_user_prompt, chat.message and the Pi input event."
  labels: [install, prompt]

- id: context/tags/allow-rule-tags-event
  title: "an allow rule with tags labels an event for later rules"
  category: context
  tier: P0
  guarantee: "A rule with action allow and tags labels the event and does not change the decision. The entry stores the tag, tags_seen records its first sequence, and a later rule on context.tags_seen blocks."
  labels: [context, tags, policy]

- id: context/tags/all-matched-rules-tag
  title: "every matched rule adds its tags to the entry"
  category: context
  tier: P1
  guarantee: "The context entry stores the union of the tags of every matched rule, at any decision, not only the tags of the winning rule."
  labels: [context, tags, policy]

- id: context/tags/content-pattern-on-observation
  title: "content_patterns on an observation read the tool output"
  category: context
  tier: P1
  guarantee: "For a post event, content_patterns read the tool output. A tag rule on action.kind observation tags a command whose output holds an AWS key."
  labels: [context, tags, observation]

- id: context/observation/origin-recorded
  title: "the context records the origin of content"
  category: context
  tier: P1
  guarantee: "A web tool gives the origin web, an mcp__<server>__ tool gives mcp with the server, and a read outside the working directory gives file_external. The entry, origins_seen, action.origin, action.source and the output label carry it."
  labels: [context, observation, origin]

- id: context/observation/ambiguous-mcp-server
  title: "a rule that denies an MCP server matches an ambiguous tool name"
  category: context
  tier: P1
  guarantee: "An mcp__ tool name with __ in the tool part leaves action.source empty, puts every server reading in action.sources, and adds mcp:<server> to origins_seen for each reading."
  labels: [context, observation, origin]

- id: policy/validate/tag-name-format
  title: "policy validation rejects a bad tag name"
  category: policy
  tier: P2
  guarantee: "gryph policy validate accepts lower-case tag names with digits, underscores and hyphens, and rejects any other name with the rule and the tag in the message. An installed policy with a legacy tag still loads and enforces."
  labels: [policy, tags, validate]

- id: context/dataflow/example-policy-blocks-exfiltration
  title: "the example policy blocks egress after a secret read"
  category: context
  tier: P0
  guarantee: "The shipped secret-exfiltration example policy installs, lets a network command before a secret read pass, and blocks a command that contacts a host after a read of .env. It also blocks one command that reads a secret and contacts a host, including a read of ~/.ssh and a host that xargs gives to curl."
  labels: [context, dataflow, tags, examples]

- id: context/cel/entries-query
  title: "a rule reads the entry log with glob()"
  category: context
  tier: P1
  guarantee: "context.entries holds the latest entries with their paths, and glob(path, pattern) matches a path. A rule blocks a write after a .pem read."
  labels: [context, cel]

- id: context/counters/failed-call-counts-error
  title: "a failed tool call counts one error"
  category: context
  tier: P1
  guarantee: "A pre hook and a failed post hook count one action and one error, and a rule on context.errors sees the error on the next call."
  labels: [context, counters]

- id: policy/test/context-file
  title: "policy test reads a session context from a file"
  category: policy
  tier: P1
  guarantee: "gryph policy test --context-file evaluates a rule on tags_seen and entries from a YAML file, --kind and --origin set the action facts, and an unknown key in the file is an error."
  labels: [policy, test, context]

- id: policy/validate/semantic-drift-removed
  title: "a policy on semantic_drift fails validation"
  category: policy
  tier: P2
  guarantee: "context.semantic_drift is removed. Policy validation rejects a policy that reads it, also through an alias, with a message that names the field. An installed policy that reads it still loads, reads it as zero, and enforces."
  labels: [policy, validate]

- id: context/window/content-by-level
  title: "the window prints content stored at the full level only"
  category: context
  tier: P0
  guarantee: "gryph policy context --window --content prints content stored at full. For an event stored at standard it prints the digest only, also after the config changes to full. It never prints the content of a sensitive path."
  labels: [context, window, privacy]

- id: context/window/keeps-latest-intent
  title: "the window keeps the latest prompt"
  category: context
  tier: P2
  guarantee: "With --limit 3 and ten actions after a prompt, the window still holds the prompt."
  labels: [context, window, intent]
