name: CI
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  run-test:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod

      - name: Build and Test
        run: |
          go mod tidy
          go build ./cmd/gryph
          go test -coverprofile=coverage.txt -v ./...

      - name: Upload Coverage
        if: (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push'
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # run-test covers Linux and uploads coverage. The platform code of
  # macOS and Windows (peer credentials, the scheduler, key files, the
  # listener) has its own tests, and only a runner of that OS runs them.
  run-test-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test -timeout 15m ./...

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod

      - name: Fuzz Shell Analysis
        run: go test -run '^$' -fuzz=FuzzAnalyze -fuzztime=30s ./aarm/shellcmd/

      - name: Fuzz Path Matcher
        run: go test -run '^$' -fuzz=FuzzGlobsOverlap -fuzztime=30s ./aarm/pdp/

  bench-hook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod

      - name: Benchmark Hook Latency
        shell: bash
        run: make bench-hook BENCHTIME=30x | tee "${RUNNER_TEMP}/bench-hook.txt"

      - name: Upload Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: bench-hook
          path: |
            ${{ runner.temp }}/bench-hook.txt
            perf-reports/hook-latency.md

  windows-keys:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod

      - name: Run Windows Acceptance Scripts
        env:
          ACCEPTANCE_LABELS: windows
        run: go test -tags acceptance -timeout 10m ./test/acceptance

  verify-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod

      - name: Verify JSON Schema is up-to-date
        run: make verify-schema

  acceptance:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      # The unit coverage misses the code that only the real binary runs:
      # the commands, the engine and the hook path. On Linux the suite runs
      # a binary built with -cover, and the result goes to Codecov next to
      # the unit coverage.
      - name: Build With Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          mkdir -p "${RUNNER_TEMP}/gryph-cover" "${RUNNER_TEMP}/gocover"
          go build -cover -coverpkg=./... -o "${RUNNER_TEMP}/gryph-cover/gryph" ./cmd/gryph
          echo "GRYPH_BIN=${RUNNER_TEMP}/gryph-cover/gryph" >> "$GITHUB_ENV"
          echo "GOCOVERDIR=${RUNNER_TEMP}/gocover" >> "$GITHUB_ENV"

      - name: Run Acceptance Suite
        run: |
          gotestsum --junitfile "${RUNNER_TEMP}/acceptance.xml" --format testname \
            -- -tags acceptance -timeout 10m ./test/acceptance

      - name: Render Report
        if: always()
        run: |
          go run ./test/acceptance/report \
            -junit "${RUNNER_TEMP}/acceptance.xml" \
            -catalog test/acceptance/catalog.yaml \
            -scripts test/acceptance/scripts \
            | tee "${RUNNER_TEMP}/acceptance-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Convert Acceptance Coverage
        if: matrix.os == 'ubuntu-latest'
        run: |
          go tool covdata textfmt -i="${GOCOVERDIR}" -o acceptance-coverage.txt
          go tool cover -func=acceptance-coverage.txt | tail -1 >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Acceptance Coverage
        if: matrix.os == 'ubuntu-latest' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) || github.event_name == 'push')
        uses: codecov/codecov-action@0565863a31f2c772f9f0395002a31e3f06189574 # v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: acceptance-coverage.txt
          flags: acceptance

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-report-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/acceptance-report.md
            ${{ runner.temp }}/acceptance.xml

  acceptance-privileged:
    # The privileged scripts write the system paths of a managed host, make
    # accounts, and run the decision service as root. They run in a
    # throwaway container, one at a time, with a system bus and polkit for
    # the local-auth scripts. The client-mode latency guard runs here too,
    # because the managed configuration that turns the client on lives in
    # /etc.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ubuntu:24.04
      options: --user root
    steps:
      - name: Install Tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git make gcc libc6-dev procps python3 dbus polkitd pkexec
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod

      - name: Start the System Bus and polkit
        run: |
          mkdir -p /run/dbus
          dbus-daemon --system --fork
          /usr/lib/polkit-1/polkitd --no-debug &
          for i in $(seq 1 50); do pkcheck --version >/dev/null 2>&1 && break; sleep 0.1; done
          pkcheck --version

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      # The managed scripts name this binary in hook entries, and the
      # install refuses a binary whose path chain is not root-owned. The
      # work directory of the runner is such a chain, so the binary goes
      # under /opt, which root owns in the container.
      - name: Build
        run: |
          mkdir -p /opt/gryph-ci
          go build -o /opt/gryph-ci/gryph ./cmd/gryph

      - name: Run Privileged Acceptance Scripts
        env:
          ACCEPTANCE_PRIVILEGED: "1"
          GRYPH_BIN: /opt/gryph-ci/gryph
        run: |
          "$(go env GOPATH)/bin/gotestsum" --junitfile "${RUNNER_TEMP}/acceptance.xml" --format testname \
            -- -tags acceptance -parallel 1 -timeout 20m ./test/acceptance

      - name: Render Report
        if: always()
        run: |
          go run ./test/acceptance/report \
            -junit "${RUNNER_TEMP}/acceptance.xml" \
            -catalog test/acceptance/catalog.yaml \
            -scripts test/acceptance/scripts \
            | tee "${RUNNER_TEMP}/acceptance-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Guard the Client Latency
        env:
          GRYPH_PERF_CLIENT: "1"
          GRYPH_BIN: /opt/gryph-ci/gryph
        run: make bench-hook BENCHTIME=50x | tee "${RUNNER_TEMP}/bench-hook-client.txt"

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-report-privileged
          path: |
            ${{ runner.temp }}/acceptance-report.md
            ${{ runner.temp }}/acceptance.xml
            ${{ runner.temp }}/bench-hook-client.txt
            perf-reports/hook-latency.md

  acceptance-privileged-macos:
    # The macOS privileged scripts install the package, make the service
    # account in the directory service, load the LaunchDaemon and write the
    # authorization database. The runner is a throwaway VM where the job
    # user has sudo without a password. The binary is built as the release
    # builds it, without cgo.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Set up Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod

      - name: Show the System Paths
        run: |
          ls -ld / /opt /private /private/var /private/var/db /private/var/log /private/var/run \
            /private/var/spool /Library "/Library/Application Support" /Library/LaunchDaemons \
            /Library/Logs || true

      - name: Build and Install the Package
        run: |
          CGO_ENABLED=0 go build -o "${RUNNER_TEMP}/gryph" ./cmd/gryph
          ./scripts/macos-pkg.sh "${RUNNER_TEMP}/gryph" 0.0.0 "${RUNNER_TEMP}/gryph.pkg"
          sudo installer -pkg "${RUNNER_TEMP}/gryph.pkg" -target /
          stat -f '%Su:%Sg %Lp' /opt/safedep/gryph/bin/gryph
          /opt/safedep/gryph/bin/gryph version

      - name: Run Privileged Unit Tests
        run: |
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            go test -count=1 -run 'ExternalFormCarriesTheRight|ChecksWhoAuthenticated' -v ./platform/internal/macos/ ./platform/localauth/

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@v1.13.0

      - name: Run Privileged Acceptance Scripts
        run: |
          sudo env "PATH=$PATH" "GOCACHE=$(go env GOCACHE)" "GOMODCACHE=$(go env GOMODCACHE)" \
            ACCEPTANCE_PRIVILEGED=1 ACCEPTANCE_LABELS=macos GRYPH_BIN=/opt/safedep/gryph/bin/gryph \
            "$(go env GOPATH)/bin/gotestsum" --junitfile "${RUNNER_TEMP}/acceptance.xml" --format testname \
            -- -tags acceptance -parallel 1 -timeout 20m ./test/acceptance

      - name: Show the Service Log
        if: failure()
        run: sudo cat /var/log/safedep/gryph-supervisor.log || true

      - name: Render Report
        if: always()
        run: |
          go run ./test/acceptance/report \
            -junit "${RUNNER_TEMP}/acceptance.xml" \
            -catalog test/acceptance/catalog.yaml \
            -scripts test/acceptance/scripts \
            | tee "${RUNNER_TEMP}/acceptance-report.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: acceptance-report-privileged-macos
          path: |
            ${{ runner.temp }}/acceptance-report.md
            ${{ runner.temp }}/acceptance.xml

  goreleaser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Go
        uses: actions/setup-go@0aaccfd150d50ccaeb58ebd88d36e91967a5f35b # v5
        with:
          go-version-file: go.mod

      - name: Run Goreleaser
        uses: goreleaser/goreleaser-action@286f3b13b1b49da4ac219696163fb8c1c93e1200 # v6.0.0
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --clean --snapshot

      - name: Check the macOS Package Input
        run: test -f dist/gryph_darwin_all/gryph

      - name: Run Acceptance Suite Against Release Binary
        run: |
          BIN="$(find dist -type f -name gryph -path '*linux_amd64*' | head -n1)"
          test -n "$BIN"
          GRYPH_BIN="$PWD/$BIN" go test -tags acceptance -timeout 10m ./test/acceptance
